<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>position</title>
    <style>
        .divs {
            position: relative;
            border: 4px solid black;
            margin: 0 auto;
            /* padding:10px 10px; */
            width: 100vw;
            height: 100vh;


        }

        #name {
            position: absolute;
            left: 5px;
            top: 10px;
            font-size: 25px;
            color: black;
        }

        #name0 {
            position: absolute;
            right: 5px;
            top: 10px;
            font-size: 25px;
            color: black;
        }

        #name1 {
            position: absolute;
            left: 5px;
            bottom: 10px;
            font-size: 25px;
            color: black;
        }

        #name2 {
            position: absolute;
            right: 5px;
            bottom: 10px;
            font-size: 25px;
            color: black;
        }

        #name3 {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: black;
            font-size: 25px;
        }

        #name5 {
            position: absolute;
            right: 50%;
            bottom: 0;
            font-size: 25px;
            color: black;
        }

        #name6 {
            position: absolute;
            right: 50%;
            top: 0;
            font-size: 25px;
            color: black;
        }

        #name7 {
            position: absolute;
            right: 0;
            top: 50%;
            font-size: 25px;
            color: black;
        }

        #name8 {
            position: absolute;
            left: 0;
            bottom: 50%;
            font-size: 25px;
            color: black;
        }
    </style>
</head>

<body>
    <div class="divs">
        <img src="saketphotu.jpeg" alt="My Pic" width="100%" height="100%">
        <div id="name">saket anand</div>
        <div id="name0">saket anand</div>
        <div id="name1">saket anand</div>
        <div id="name2">saket anand</div>
        <div id="name3">saket anand</div>
        <div id="name5">saket anand</div>
        <div id="name6">saket anand</div>
        <div id="name7">saket anand</div>
        <div id="name8">saket anand</div>
    </div>

</body>

</html>
