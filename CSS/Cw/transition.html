<!DOCTYPE html>
<html>

<head>
    <style>
        div {
            width: 300px;
            height: 600px;
            background-color: rgb(41, 61, 212);
            transition: width 1s, height 1s, background-color 1s;
        }

        div:hover {
            width: 400px;
            height: 400px;
            background-color: rgb(229, 17, 17);
        }

        div:click {
            width: 500px;
            height: 500px;
            background-color: green;
        }
    </style>
</head>

<body>

    <div></div>

</body>

</html>
